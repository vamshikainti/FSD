services:
  # Existing MERN CRUD app
  - type: web
    name: badri-crud-backend
    runtime: node
    plan: free
    rootDir: mern-crud-app-main/backend
    buildCommand: npm install
    startCommand: npm start

  - type: web
    name: badri-crud-frontend
    runtime: static
    rootDir: mern-crud-app-main/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Additional Node apps
  - type: web
    name: badri-mongodb-express
    runtime: node
    plan: free
    rootDir: mongodb-express-app-main
    buildCommand: npm install
    startCommand: node app.js

  - type: web
    name: badri-mvc-auth
    runtime: node
    plan: free
    rootDir: mvc-auth-app-main
    buildCommand: npm install
    startCommand: node server.js

  - type: web
    name: badri-mvc-express
    runtime: node
    plan: free
    rootDir: mvc-express-app-main
    buildCommand: npm install
    startCommand: node server.js

  - type: web
    name: badri-products
    runtime: node
    plan: free
    rootDir: products-file-persistence-app-main
    buildCommand: npm install
    startCommand: node server.js

